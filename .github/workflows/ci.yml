name: CI Pipeline & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Security Scanning: Secret detection & Vulnerability Audit
  # =========================================================================
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Backend Audit
        working-directory: ./backend-node
        run: npm audit --audit-level=critical
        continue-on-error: true

  # =========================================================================
  # 2. Frontend CI: Types, Unit Tests & Production Bundle Build
  # =========================================================================
  frontend-ci:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Execute Vitest Suite
        run: npm test -- --run

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_API_URL: /api

  # =========================================================================
  # 3. Backend CI: Schema Sync, Database Integration & Build
  # =========================================================================
  backend-node-ci:
    name: Backend Node (Express + Prisma)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: taskmaster
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend-node
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend-node
        run: npx prisma generate

      - name: Sync Database Schema (Prisma DB Push)
        working-directory: ./backend-node
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/taskmaster

      - name: Compile Backend TypeScript
        working-directory: ./backend-node
        run: npm run build

  # =========================================================================
  # 4. Container Build Gate: Multi-stage Docker Verification
  # =========================================================================
  docker-build-gate:
    name: Docker Multi-Stage Verification
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-node-ci]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          file: ./backend-node/Dockerfile
          push: false
          tags: backend-node:ci-check

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: frontend:ci-check

